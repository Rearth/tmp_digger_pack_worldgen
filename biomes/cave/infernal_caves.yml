id: INFERNAL_CAVES
type: BIOME
extends: [ VARIANT_UNDERWORLD ]
vanilla: minecraft:nether_wastes
color: $biomes/colors.yml:LUSH_CAVES

palette:
  - LUSH_CAVES: 319
  - << meta.yml:palette-bottom

slant:
  - threshold: 1  # lower = less slant
    palette:
      - BLACKSTONE_BASALT_MIX: 319

spawning:
  costs:
    - type:
        id: minecraft:pig
      mass: 1
      gravity: 1
  spawns:
    - group: AMBIENT
      entries:
        - type:
            id: minecraft:bat
          min-group-size: 4
          max-group-size: 4
          weight: 10
    - group: MONSTER
      entries:
        - type:
            id: minecraft:ghast
          min-group-size: 1
          max-group-size: 1
          weight: 100
        - type:
            id: minecraft:magma_cube
          min-group-size: 1
          max-group-size: 3
          weight: 100
        - type:
            id: minecraft:piglin
          min-group-size: 1
          max-group-size: 3
          weight: 100
        - type:
            id: minecraft:zombified_piglin
          min-group-size: 1
          max-group-size: 3
          weight: 100
        - type:
            id: knightquest:gremlin
          min-group-size: 2
          max-group-size: 4
          weight: 95
        - type:
            id: knightquest:bad_patch
          min-group-size: 3
          max-group-size: 5
          weight: 95

features:
  landforms:
    - SMOOTH_LAVA
    - LAVA_STEPS
    - CONNECT_LAVA_STEPS
    - MAGMA_WEB
  flora:
    - UNDERGROUND_LAVA_COLUMNS
    - INFERNAL_ORE_CRYSTALS